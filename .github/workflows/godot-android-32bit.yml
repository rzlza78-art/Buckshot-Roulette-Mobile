name: Build 32-bit Godot 4 Game
on: [push, workflow_dispatch]

jobs:
  export-android:
    runs-on: ubuntu-latest
    name: Export 32-bit APK
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Godot Engine
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          # Отключаем Mono, так как большинство проектов используют стандартный GDScript.
          # Если проект точно на C#, измените значение ниже на true.
          use-mono: false
          include-templates: true

      - name: Create export directory
        run: mkdir -p build/android

      - name: Godot Android Export
        run: |
          # Скрипт сам найдет, где лежит файл project.godot, даже если он в подпапке
          PROJECT_PATH=$(find . -name "project.godot" -exec dirname {} \;)
          echo "Проект найден в папке: $PROJECT_PATH"
          
          # Запуск сборки с подробным выводом логов (--verbose)
          godot --headless --path "$PROJECT_PATH" --export-release "Android" build/android/game-32bit.apk --verbose

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-32bit-apk
          path: build/android/game-32bit.apk
          
