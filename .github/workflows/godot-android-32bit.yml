name: Godot 4 - Build 32-bit Mobile Buckshot
on:
  workflow_dispatch: # Кнопка ручного запуска

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Godot Templates and Export Tools
        run: |
          # Скачиваем стабильную версию Godot 4.3 с официального зеркала TuxFamily
          wget https://tuxfamily.org
          unzip Godot_v4.3-stable_linux.x86_64.zip
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          
          # Создаем папку для шаблонов экспорта
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          
          # Скачиваем шаблоны экспорта Android с TuxFamily
          wget https://tuxfamily.org
          unzip Godot_v4.3-stable_export_templates.tpz -d /tmp
          mv /tmp/templates/* ~/.local/share/godot/export_templates/4.3.stable/

      - name: Patch project settings for 32-bit and OpenGL
        run: |
          # Принудительно меняем в настройках проекта рендер на OpenGL (Compatibility)
          sed -i 's/rendering\/renderer\/rendering_method=.*/rendering\/renderer\/rendering_method="gl_compatibility"/' project.godot
          sed -i 's/rendering\/renderer\/rendering_method.mobile=.*/rendering\/renderer\/rendering_method.mobile="gl_compatibility"/' project.godot
          
          # Пересоздаем чистый файл пресета строго под 32-бит
          rm -f export_presets.cfg
          cat << 'EOF' > export_presets.cfg
          [preset.0]
          name="Android 32bit"
          platform="Android"
          runnable=true
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/BuckshotRoulette32.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]
          architectures/armeabi-v7a=true
          architectures/arm64-v8a=false
          architectures/x86=false
          architectures/x86_64=false
          rendering/renderer="gl_compatibility"
          package/unique_name="com.mobile.buckshot.roulette.32bit"
          package/name="Buckshot Roulette 32bit"
          package/signed=true
          keystore/debug="debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          EOF

      - name: Create Keystore for Android signing
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999

      - name: Export APK via Godot
        run: |
          mkdir -p build/
          godot --headless --export-release "Android 32bit" build/BuckshotRoulette32.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Buckshot-Roulette-Android-32bit
          path: build/BuckshotRoulette32.apk
          
