name: Build 32-bit Godot 4 Game
on: [push, workflow_dispatch]

jobs:
  export-android:
    runs-on: ubuntu-latest
    name: Export 32-bit APK
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Godot Engine
        uses: chickensoft-games/setup-godot@v2
        with:
          # По умолчанию ставим последнюю стабильную Godot 4.
          # Если сборка упадет с ошибкой версии, здесь можно будет поменять на 4.0, 4.1, 4.2 и т.д.
          version: 4.3.0
          include-templates: true

      - name: Create export directory
        run: mkdir -p build/android

      - name: Godot Android Export
        run: |
          godot --headless --export-release "Android" build/android/game-32bit.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-32bit-apk
          path: build/android/game-32bit.apk
          
